# 개발: `docker compose up -d db` 로 DB 만. 사내 서버: `docker compose up -d` 로 DB + 앱 (00 D-04)
services:
  db:
    image: postgres:16-alpine
    container_name: survey-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: survey
    ports:
      # 서버 안에서만 열린다. 앱은 도커 내부 연결(db:5432)로 붙으므로 영향 없다
      - "127.0.0.1:5432:5432"
    volumes:
      - survey-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 설문 사이트 앱. web/.env 의 값을 읽고, DB 주소만 컨테이너끼리 쓰는 주소로 덮는다
  app:
    build: ./web
    container_name: survey-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./web/.env
        required: false
    environment:
      DATABASE_URL: postgresql://survey:${POSTGRES_PASSWORD:-devpassword}@db:5432/survey?schema=public
      # 백업: 앱 안의 pg_dump 가 아래 PG* 값으로 DB 에 붙는다 (docker exec 는 컨테이너 안에서 못 쓴다)
      BACKUP_DUMP_CMD: pg_dump --clean --if-exists --no-owner --no-privileges
      BACKUP_DIR: /app/backups
      PGHOST: db
      PGUSER: survey
      PGPASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      PGDATABASE: survey
      # 개발용 비밀번호 그대로면 앱이 켜지지 않는다 (scripts/docker-start.sh)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "3000:3000"
    volumes:
      - ./backups:/app/backups

  # ── 시험용 DB (2026-08-26) ──
  #
  # **진짜와 똑같이 생겼지만 비어 있는 DB.** 표 구조·제약조건·연쇄 삭제 규칙이
  # 전부 같다(같은 마이그레이션을 쓴다). 안에 든 데이터만 없다.
  #
  # 왜 따로 두나 — 테스트는 사람을 만들고 답을 저장하고 표를 비운다. 그걸
  # 진짜 DB에서 하면 ① 가짜 사람이 쌓여 분석이 흔들리고 ② 세는 숫자가
  # 시험 도중에 바뀌고 ③ **지우는 조건을 한 글자 틀리면 진짜가 날아간다.**
  #
  # 포트도 저장 공간도 진짜와 완전히 따로다. 서로 닿을 수 없다.
  # ⚠️ 저장 공간을 볼륨으로 두지 않는다 — 컨테이너를 지우면 같이 사라지는
  #    편이 맞다. 시험 데이터는 남길 이유가 없다.
  db-test:
    # 운영 서버에서 `docker compose up -d` 할 때 같이 뜨지 않게 (npm run db:test:up 은 그대로 된다)
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: survey-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: survey_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  survey-pgdata:
