# 7차원 성향 설문 — 문항 v1
#
# 이 파일이 검사의 실체다. 고칠 때 프로그램은 건드리지 않는다.
# seed 전에 형식 검사를 통과해야 한다 (src/lib/items/validate.ts).
#
# ── 작성 규칙 ─────────────────────────────────────────────────────────
#
# 1. 하위척도는 한국판 TCI-RS 공식 명칭을 쓴다 (00 §2.9.3).
#    양극 명칭이 역채점 방향을 그대로 알려준다.
#    예) `탐색적 흥분 / 관습적 안정성` → 관습적 안정성 쪽 진술이 역방향 문항.
#
# 2. sourceRef 에 어디서 온 문항인지 반드시 적는다 (00 §5 저작권 대응).
#    IPIP 프록시는 "어떤 내용이 이 척도와 상관이 높은가"를 알려주는 참고자료다.
#    문항을 옮기는 것이 아니라 방향만 보고 한국어로 새로 쓴다.
#
# 3. 맥락화 — 직장 상황으로 묻는 문항이 일반형보다 직무성과를 잘 예측한다(08).
#    다만 **기질 축은 절반쯤만 맥락화한다.** 기질은 원래 상황과 무관하게
#    나타나는 것을 재는 축이라, 전부 직장 상황으로 바꾸면 다른 것을 재게 된다.
#    성격 축(자율성·연대감·자기초월)은 대부분 맥락화한다.
#
# 4. 역방향 비율 25~45%. 짝(antonymOf)은 서로를 가리키고 방향이 반대여야 한다.
#    이 짝이 응답 품질 지표 두 축 중 하나(반대 문항 일치도)의 전부다.
#
# ── 진행 상황 ─────────────────────────────────────────────────────────
#   자극추구   15 / 15  ✅
#   위험회피   15 / 15  ✅
#   사회적민감성 15 / 15  ✅
#   인내력     15 / 15  ✅
#   자율성     15 / 15  ✅
#   연대감     15 / 15  ✅
#   자기초월   15 / 15  ✅
#   직무능력    9 / 9   ✅

version: 1
title: 7차원 성향 설문 v1

items:
  # ══ 자극추구 (NS) ══════════════════════════════════════════════════
  # IPIP 프록시: Variety-seeking(.72) · Recklessness(.60) ·
  #              Extravagance(.60) · Rebelliousness(.60)  — 00 §2.1

  # ── 탐색적 흥분 / 관습적 안정성 ──
  - kind: trait
    code: NS1-01
    scale: 자극추구
    subscale: 탐색적 흥분
    content: 처음 맡는 거래처를 배정받으면 부담보다 흥미가 앞선다.
    sourceRef: 한국판 TCI-RS 탐색적 흥분 facet 정의 · IPIP Variety-seeking 참고(.72)
    antonymOf: NS1-02

  - kind: trait
    code: NS1-02
    scale: 자극추구
    subscale: 탐색적 흥분
    content: 늘 하던 방식대로 하는 일이 마음이 편하다.
    reverse: true
    sourceRef: 한국판 TCI-RS 관습적 안정성(양극 반대편) · NS1-01의 반대 방향
    antonymOf: NS1-01

  - kind: trait
    code: NS1-03
    scale: 자극추구
    subscale: 탐색적 흥분
    content: 안 가본 동네나 새로 생긴 곳을 굳이 찾아가 보는 편이다.
    sourceRef: 한국판 TCI-RS 탐색적 흥분 facet 정의 · IPIP Variety-seeking 참고

  - kind: trait
    code: NS1-04
    scale: 자극추구
    subscale: 탐색적 흥분
    content: 회의에서 아무도 꺼내지 않은 방식을 먼저 말해보는 편이다.
    sourceRef: 한국판 TCI-RS 탐색적 흥분 facet 정의 · 직장 맥락

  # ── 충동성 / 심사숙고 ──
  - kind: trait
    code: NS2-01
    scale: 자극추구
    subscale: 충동성
    content: 괜찮아 보이는 일은 자세히 따져보기 전에 일단 시작한다.
    sourceRef: 한국판 TCI-RS 충동성 facet 정의 · IPIP Recklessness 참고(.60)
    antonymOf: NS2-02

  - kind: trait
    code: NS2-02
    scale: 자극추구
    subscale: 충동성
    content: 일을 정하기 전에 따져볼 것은 다 따져보고 넘어간다.
    reverse: true
    sourceRef: 한국판 TCI-RS 심사숙고(양극 반대편) · NS2-01의 반대 방향
    antonymOf: NS2-01

  - kind: trait
    code: NS2-03
    scale: 자극추구
    subscale: 충동성
    content: 하고 싶은 말이 떠오르면 담아두기가 어렵다.
    sourceRef: 한국판 TCI-RS 충동성 facet 정의 · IPIP Recklessness 참고

  - kind: trait
    code: NS2-04
    scale: 자극추구
    subscale: 충동성
    content: 언짢은 일이 있어도 한 박자 두고 반응하는 편이다.
    reverse: true
    sourceRef: 한국판 TCI-RS 심사숙고(양극 반대편)

  # ── 무절제 / 절제 ──
  - kind: trait
    code: NS3-01
    scale: 자극추구
    subscale: 무절제
    content: 갖고 싶은 것이 생기면 형편을 따지기 전에 사는 편이다.
    sourceRef: 한국판 TCI-RS 무절제 facet 정의 · IPIP Extravagance 참고(.60)
    antonymOf: NS3-02

  - kind: trait
    code: NS3-02
    scale: 자극추구
    subscale: 무절제
    content: 쓸 돈은 미리 정해두고 그 안에서 쓴다.
    reverse: true
    sourceRef: 한국판 TCI-RS 절제(양극 반대편) · NS3-01의 반대 방향
    antonymOf: NS3-01

  - kind: trait
    code: NS3-03
    scale: 자극추구
    subscale: 무절제
    content: 재미있는 자리가 생기면 다음 날 일정을 생각하지 않고 끝까지 간다.
    sourceRef: 한국판 TCI-RS 무절제 facet 정의 · IPIP Extravagance 참고

  - kind: trait
    code: NS3-04
    scale: 자극추구
    subscale: 무절제
    content: 한번 흥이 오르면 적당한 선에서 멈추기가 어렵다.
    sourceRef: 한국판 TCI-RS 무절제 facet 정의

  # ── 자유분방 / 질서정연 ──
  - kind: trait
    code: NS4-01
    scale: 자극추구
    subscale: 자유분방
    content: 정해진 절차가 번거로우면 건너뛰고 싶어진다.
    sourceRef: 한국판 TCI-RS 자유분방 facet 정의 · IPIP Rebelliousness 참고(.60)
    antonymOf: NS4-02

  - kind: trait
    code: NS4-02
    scale: 자극추구
    subscale: 자유분방
    content: 정해진 규정은 번거로워도 그대로 따르는 편이다.
    reverse: true
    sourceRef: 한국판 TCI-RS 질서정연(양극 반대편) · NS4-01의 반대 방향
    antonymOf: NS4-01

  - kind: trait
    code: NS4-03
    scale: 자극추구
    subscale: 자유분방
    content: 미리 계획을 세우기보다 그때그때 정하는 편이 편하다.
    sourceRef: 한국판 TCI-RS 자유분방 facet 정의

  # ══ 위험회피 (HA) ══════════════════════════════════════════════════
  # IPIP 프록시: Neuroticism(.74) · Harmavoidance(.61) ·
  #              Social discomfort(.81) · Low self-efficacy(.53)  — 00 §2.1
  # 관련도 표에서 협력 −.25, 자율적 실행 −.36 으로 나온 축이다 (07).

  # ── 예기불안 ──
  - kind: trait
    code: HA1-01
    scale: 위험회피
    subscale: 예기불안
    content: 일을 맡으면 잘못될 수 있는 경우부터 먼저 떠올린다.
    sourceRef: 한국판 TCI-RS 예기불안 facet 정의 · IPIP Neuroticism 참고(.74)
    antonymOf: HA1-02

  - kind: trait
    code: HA1-02
    scale: 위험회피
    subscale: 예기불안
    content: 일을 맡으면 일단 되는 쪽으로 생각하고 시작한다.
    reverse: true
    sourceRef: 한국판 TCI-RS 예기불안 반대 방향 · HA1-01의 짝
    antonymOf: HA1-01

  - kind: trait
    code: HA1-03
    scale: 위험회피
    subscale: 예기불안
    content: 별일 없을 것을 알면서도 마음이 놓이지 않을 때가 있다.
    sourceRef: 한국판 TCI-RS 예기불안 facet 정의 · IPIP Neuroticism 참고

  - kind: trait
    code: HA1-04
    scale: 위험회피
    subscale: 예기불안
    content: 발표나 보고를 앞두면 며칠 전부터 신경이 쓰인다.
    sourceRef: 한국판 TCI-RS 예기불안 facet 정의 · 직장 맥락

  # ── 불확실성에 대한 두려움 ──
  - kind: trait
    code: HA2-01
    scale: 위험회피
    subscale: 불확실성에 대한 두려움
    content: 어떻게 될지 모르는 상태가 길어지면 견디기 힘들다.
    sourceRef: 한국판 TCI-RS 불확실성에 대한 두려움 facet 정의 · IPIP Harmavoidance 참고(.61)
    antonymOf: HA2-02

  - kind: trait
    code: HA2-02
    scale: 위험회피
    subscale: 불확실성에 대한 두려움
    content: 결과가 정해지지 않은 일도 크게 불편하지 않다.
    reverse: true
    sourceRef: 한국판 TCI-RS 불확실성에 대한 두려움 반대 방향 · HA2-01의 짝
    antonymOf: HA2-01

  - kind: trait
    code: HA2-03
    scale: 위험회피
    subscale: 불확실성에 대한 두려움
    content: 처음 해보는 방식보다 결과가 확인된 방식을 고른다.
    sourceRef: 한국판 TCI-RS 불확실성에 대한 두려움 facet 정의

  - kind: trait
    code: HA2-04
    scale: 위험회피
    subscale: 불확실성에 대한 두려움
    content: 낯선 자리에 가기 전에 미리 알아보고 가야 마음이 놓인다.
    sourceRef: 한국판 TCI-RS 불확실성에 대한 두려움 facet 정의 · IPIP Harmavoidance 참고

  # ── 낯선 사람에 대한 수줍음 ──
  # 원본과의 상관이 .81로 7축 하위척도 중 가장 높다. 구성개념이 명확한 편.
  - kind: trait
    code: HA3-01
    scale: 위험회피
    subscale: 낯선 사람에 대한 수줍음
    content: 처음 보는 사람이 많은 자리에서는 말수가 줄어든다.
    sourceRef: 한국판 TCI-RS 낯선 사람에 대한 수줍음 facet 정의 · IPIP Social discomfort 참고(.81)
    antonymOf: HA3-02

  - kind: trait
    code: HA3-02
    scale: 위험회피
    subscale: 낯선 사람에 대한 수줍음
    content: 처음 만난 사람과도 어렵지 않게 말을 트는 편이다.
    reverse: true
    sourceRef: 한국판 TCI-RS 낯선 사람에 대한 수줍음 반대 방향 · HA3-01의 짝
    antonymOf: HA3-01

  - kind: trait
    code: HA3-03
    scale: 위험회피
    subscale: 낯선 사람에 대한 수줍음
    content: 잘 모르는 부서 사람에게 먼저 말을 거는 것이 부담스럽다.
    sourceRef: 한국판 TCI-RS 낯선 사람에 대한 수줍음 facet 정의 · 직장 맥락

  - kind: trait
    code: HA3-04
    scale: 위험회피
    subscale: 낯선 사람에 대한 수줍음
    content: 여러 사람 앞에서 이야기할 때 긴장이 잘 가라앉지 않는다.
    sourceRef: 한국판 TCI-RS 낯선 사람에 대한 수줍음 facet 정의

  # ── 쉽게 지침 ──
  - kind: trait
    code: HA4-01
    scale: 위험회피
    subscale: 쉽게 지침
    content: 바쁜 시기가 지나고 나면 한동안 회복이 되지 않는다.
    sourceRef: 한국판 TCI-RS 쉽게 지침 facet 정의 · IPIP Low self-efficacy 참고(.53)
    antonymOf: HA4-02

  - kind: trait
    code: HA4-02
    scale: 위험회피
    subscale: 쉽게 지침
    content: 일이 몰려도 하루 쉬면 대체로 회복된다.
    reverse: true
    sourceRef: 한국판 TCI-RS 쉽게 지침 반대 방향 · HA4-01의 짝
    antonymOf: HA4-01

  - kind: trait
    code: HA4-03
    scale: 위험회피
    subscale: 쉽게 지침
    content: 남들보다 쉽게 피곤해지는 편이다.
    sourceRef: 한국판 TCI-RS 쉽게 지침 facet 정의 · IPIP Low self-efficacy 참고

  # ══ 사회적 민감성 (RD) ═════════════════════════════════════════════
  # IPIP 프록시: Sentimentality(.67) · Friendliness(.79) ·
  #              Self-disclosure(.78) · Dependence(.56)  — 00 §2.1
  # 관련도 표에서 협력과 −.34. 이름과 결과가 어긋나는 축이다 (07).

  # ── 정서적 감수성 ──
  - kind: trait
    code: RD1-01
    scale: 사회적민감성
    subscale: 정서적 감수성
    content: 다른 사람의 표정이나 말투가 달라지면 금방 알아챈다.
    sourceRef: 한국판 TCI-RS 정서적 감수성 facet 정의 · IPIP Sentimentality 참고(.67)
    antonymOf: RD1-02

  - kind: trait
    code: RD1-02
    scale: 사회적민감성
    subscale: 정서적 감수성
    content: 남이 기분이 상했는지는 말해주기 전에는 잘 모른다.
    reverse: true
    sourceRef: 한국판 TCI-RS 정서적 감수성 반대 방향 · RD1-01의 짝
    antonymOf: RD1-01

  - kind: trait
    code: RD1-03
    scale: 사회적민감성
    subscale: 정서적 감수성
    content: 슬픈 이야기를 들으면 한동안 마음에 남는다.
    sourceRef: 한국판 TCI-RS 정서적 감수성 facet 정의

  - kind: trait
    code: RD1-04
    scale: 사회적민감성
    subscale: 정서적 감수성
    content: 회의 분위기가 가라앉으면 금세 알아차린다.
    sourceRef: 한국판 TCI-RS 정서적 감수성 facet 정의 · 직장 맥락

  # ── 정서적 개방성 ──
  - kind: trait
    code: RD2-01
    scale: 사회적민감성
    subscale: 정서적 개방성
    content: 동료가 힘들어 보이면 먼저 말을 건네는 편이다.
    sourceRef: 한국판 TCI-RS 정서적 개방성 facet 정의 · IPIP Friendliness 참고(.79)
    antonymOf: RD2-02

  - kind: trait
    code: RD2-02
    scale: 사회적민감성
    subscale: 정서적 개방성
    content: 동료의 개인적인 사정에는 되도록 끼어들지 않는다.
    reverse: true
    sourceRef: 한국판 TCI-RS 정서적 개방성 반대 방향 · RD2-01의 짝
    antonymOf: RD2-01

  - kind: trait
    code: RD2-03
    scale: 사회적민감성
    subscale: 정서적 개방성
    content: 처음 만난 사람에게도 따뜻하게 대하는 편이다.
    sourceRef: 한국판 TCI-RS 정서적 개방성 facet 정의 · IPIP Friendliness 참고

  - kind: trait
    code: RD2-04
    scale: 사회적민감성
    subscale: 정서적 개방성
    content: 고맙거나 미안한 마음은 말로 표현하는 편이다.
    sourceRef: 한국판 TCI-RS 정서적 개방성 facet 정의

  # ── 친밀감 / 거리두기 ──
  - kind: trait
    code: RD3-01
    scale: 사회적민감성
    subscale: 친밀감
    content: 회사에도 속 얘기를 나눌 수 있는 사람이 있으면 좋겠다.
    sourceRef: 한국판 TCI-RS 친밀감 facet 정의 · IPIP Self-disclosure 참고(.78)
    antonymOf: RD3-02

  - kind: trait
    code: RD3-02
    scale: 사회적민감성
    subscale: 친밀감
    content: 회사 사람과는 일 얘기만 하는 편이 편하다.
    reverse: true
    sourceRef: 한국판 TCI-RS 거리두기(양극 반대편) · RD3-01의 짝
    antonymOf: RD3-01

  - kind: trait
    code: RD3-03
    scale: 사회적민감성
    subscale: 친밀감
    content: 가까운 사람에게는 내 고민을 털어놓는 편이다.
    sourceRef: 한국판 TCI-RS 친밀감 facet 정의 · IPIP Self-disclosure 참고

  - kind: trait
    code: RD3-04
    scale: 사회적민감성
    subscale: 친밀감
    content: 오래 알고 지낸 사람들과의 관계를 중요하게 여긴다.
