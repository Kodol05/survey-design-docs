  # ══ 자기초월 (ST) ══════════════════════════════════════════════════
  # 하위척도 3개(00 §2.9.4 안 B′)라 축당 5문항씩 배분한다.
  # ST1 IPIP Imagination 참고(.65) · ST2 Romanticism 참고(.58)
  # ST3는 IPIP에 대응 항목이 없어 한국판 facet 정의로만 쓴다 (00 §2.9.4).
  #
  # ⚠️ 이 축은 맥락화가 3/15로 낮다. 초월 경험 자체가 업무 상황과 무관한
  #    개념이라 억지로 직장으로 옮기면 다른 것을 재게 된다.
  # ⚠️ ST3는 종교를 묻지 않는다. TCI의 구성개념은 특정 신앙이 아니라
  #    "설명되지 않는 것을 받아들이는 태도"다.
  #    2026-08-23 — 사내 검사라 한 번 더 무디게 고쳤다. "뜻이 있다", "눈에 보이는
  #    것이 전부는 아니다" 같은 표현을 빼고 앎의 한계와 실제 경험 쪽으로 옮겼다.
  #    구성개념은 그대로지만 신념을 묻는 것처럼 읽히지 않게 한 것이다.

  # ── 창조적 자기망각 / 자의식 ──
  - kind: trait
    code: ST1-01
    scale: 자기초월
    subscale: 창조적 자기망각
    content: 어떤 일에 몰두하면 시간 가는 줄 모른다.
    sourceRef: 한국판 TCI-RS 창조적 자기망각 facet 정의 · IPIP Imagination 참고(.65)
    antonymOf: ST1-02

  - kind: trait
    code: ST1-02
    scale: 자기초월
    subscale: 창조적 자기망각
    content: 무슨 일을 하든 시간이 얼마나 지났는지 의식하는 편이다.
    reverse: true
    sourceRef: 한국판 TCI-RS 자의식(양극 반대편) · ST1-01의 짝
    antonymOf: ST1-01

  - kind: trait
    code: ST1-03
    scale: 자기초월
    subscale: 창조적 자기망각
    content: 머릿속으로 이런저런 장면을 그려보는 것을 즐긴다.
    sourceRef: 한국판 TCI-RS 창조적 자기망각 facet 정의 · IPIP Imagination 참고

  - kind: trait
    code: ST1-04
    scale: 자기초월
    subscale: 창조적 자기망각
    content: 한 가지에 빠져 있으면 주변 소리가 잘 들리지 않는다.
    sourceRef: 한국판 TCI-RS 창조적 자기망각 facet 정의 · 직장 맥락

  - kind: trait
    code: ST1-05
    scale: 자기초월
    subscale: 창조적 자기망각
    content: 무언가에 푹 빠져 있을 때가 가장 즐겁다.
    sourceRef: 한국판 TCI-RS 창조적 자기망각 facet 정의

  # ── 우주만물과의 일체감 ──
  - kind: trait
    code: ST2-01
    scale: 자기초월
    subscale: 우주만물과의 일체감
    content: 자연 속에 있으면 나라는 경계가 옅어지는 느낌이 든다.
    sourceRef: 한국판 TCI-RS 우주만물과의 일체감 facet 정의 · IPIP Romanticism 참고(.58)

  - kind: trait
    code: ST2-02
    scale: 자기초월
    subscale: 우주만물과의 일체감
    content: 세상 모든 것이 어떤 식으로든 이어져 있다고 느낀다.
    sourceRef: 한국판 TCI-RS 우주만물과의 일체감 facet 정의
    antonymOf: ST2-03

  - kind: trait
    code: ST2-03
    scale: 자기초월
    subscale: 우주만물과의 일체감
    content: 사람이든 사물이든 결국 각각 따로 있는 것이라고 본다.
    reverse: true
    sourceRef: 한국판 TCI-RS 우주만물과의 일체감 반대 방향 · ST2-02의 짝
    antonymOf: ST2-02

  - kind: trait
    code: ST2-04
    scale: 자기초월
    subscale: 우주만물과의 일체감
    content: 나보다 큰 무언가의 일부라고 느낄 때가 있다.
    sourceRef: 한국판 TCI-RS 우주만물과의 일체감 facet 정의

  - kind: trait
    code: ST2-05
    scale: 자기초월
    subscale: 우주만물과의 일체감
    content: 음악이나 풍경에 마음이 크게 움직일 때가 있다.
    sourceRef: 한국판 TCI-RS 우주만물과의 일체감 facet 정의 · IPIP Romanticism 참고

  # ── 영성 수용 / 합리적 유물론 ──
  - kind: trait
    code: ST3-01
    scale: 자기초월
    subscale: 영성 수용
    content: 세상에는 아직 설명되지 않은 것이 많다고 생각한다.
    sourceRef: 한국판 TCI-RS 영성 수용 facet 정의 (IPIP 대응 항목 없음, 00 §2.9.4)
    antonymOf: ST3-02

  - kind: trait
    code: ST3-02
    scale: 자기초월
    subscale: 영성 수용
    content: 확인된 근거가 없으면 잘 받아들이지 않는 편이다.
    reverse: true
    sourceRef: 한국판 TCI-RS 합리적 유물론(양극 반대편) · ST3-01의 짝
    antonymOf: ST3-01

  - kind: trait
    code: ST3-03
    scale: 자기초월
    subscale: 영성 수용
    content: 돌이켜보면 우연만은 아니었던 것 같은 일이 있다.
    sourceRef: 한국판 TCI-RS 영성 수용 facet 정의

  - kind: trait
    code: ST3-04
    scale: 자기초월
    subscale: 영성 수용
    content: 사람이 알 수 있는 것에는 한계가 있다고 생각한다.
    sourceRef: 한국판 TCI-RS 영성 수용 facet 정의

  - kind: trait
    code: ST3-05
    scale: 자기초월
    subscale: 영성 수용
    content: 웬만한 일은 따져보면 이유가 있다고 본다.
    reverse: true
    sourceRef: 한국판 TCI-RS 합리적 유물론(양극 반대편)

  # ══ 직무능력 ═══════════════════════════════════════════════════════
  # 능력당 직접형 1 + 간접형 2 (07). 성향 문항 사이에 섞어 배치한다.
  # 직접형만 두면 거의 다 높게 답해서 사람마다 구분이 되지 않는다.

  - kind: ability
    code: AB-COOP-01
    axis: 협력
    direct: true
    content: 여러 사람과 하는 일에서 내 몫을 잘 해내는 편이다.
    sourceRef: 07-job-ability.md 직접형

  - kind: ability
    code: AB-COOP-02
    axis: 협력
    direct: false
    content: 일이 밀릴 것 같으면 미리 동료에게 알린다.
    sourceRef: 07-job-ability.md 간접형 — 능력이 아니라 행동을 묻는다

  - kind: ability
    code: AB-COOP-03
    axis: 협력
    direct: false
    content: 내 담당이 아니어도 옆에서 막히면 한 번은 들여다본다.
    sourceRef: 07-job-ability.md 간접형

  # ── 조직생활 ──
  # 정의: 오래 다닌다 + 주변 사람들과 잘 어울린다 (07, 09).
  # "회사 방식에 따라온다" 쪽이 아니라 **대인 융화** 쪽으로 쓴다.
  - kind: ability
    code: AB-ORG-01
    axis: 조직생활
    direct: true
    content: 회사 사람들과 두루 잘 지내는 편이다.
    sourceRef: 07-job-ability.md 직접형

  - kind: ability
    code: AB-ORG-02
    axis: 조직생활
    direct: false
    content: 점심이나 쉬는 시간에 이야기를 나누는 동료가 여럿 있다.
    sourceRef: 07-job-ability.md 간접형 — 대인 융화

  - kind: ability
    code: AB-ORG-03
    axis: 조직생활
    direct: false
    content: 힘든 일이 있어도 그만두는 것까지 생각하지는 않는다.
    sourceRef: 07-job-ability.md 간접형 — 오래 다닌다. 근속 기록과 대조할 수 있는 축

  # ── 자율적 실행 ──
  - kind: ability
    code: AB-AUTO-01
    axis: 자율적실행
    direct: true
    content: 지시가 없어도 스스로 일을 진행하는 편이다.
    sourceRef: 07-job-ability.md 직접형

  - kind: ability
    code: AB-AUTO-02
    axis: 자율적실행
    direct: false
    content: 어떻게 할지 애매하면 일단 내 판단으로 해보고 나중에 확인받는다.
    sourceRef: 07-job-ability.md 간접형

  - kind: ability
    code: AB-AUTO-03
    axis: 자율적실행
    direct: false
    content: 맡은 일의 다음 단계를 누가 말해주지 않아도 챙긴다.
    sourceRef: 07-job-ability.md 간접형
